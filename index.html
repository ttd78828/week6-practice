<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cobalt Coast Surf School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Cobalt Coast Surf School</h1>
  </header>
  <main>
    <h2>Book a Lesson</h2>
    <p>Cobalt Coast Surf School offers beginner through advanced surf lessons on the north shore, seven days a week. Fill out the form below and we will get back to you to confirm a time.</p>
    <form action="https://formspree.io/f/your-form-id" method="post">
      <label for="name">Name</label>
      <input  type="text" id="name" name="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" required>
      <p>Which lesson are you booking></p>
      <label for="lesson-group">Beginner Group Lesson</label>
      <input type="radio" id="lesson-group" name="lesson-type" value="group" checked>
      <label for="lesson-group">Private Lesson</label>
      <input type="radio" id="lesson-private" name="lesson-type" value="private">
      <label for="newsletter">Email me about upcoming clinics and sirf camps</label>
      <input type="checkbox" id="newsletter" name="newsletter">
      <label for="message">What would you like to ask or tell us?</label>
      <textarea id="message" name="message" rows="5" cols="40" required></textarea>
      <button type="submit">Send Booking Request</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Cobalt Coast Surf School</p>
  </footer>
</body>
</html>
